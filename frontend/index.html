    <meta name="description" content="One workspace for academic research: discover topics, survey literature, draft manuscripts, and match journals and conferences without switching tools." />
    <title>Research Agent — Discover topics, draft papers, and match venues</title>
    <script>
      (function () {
        try {
          var path = location.pathname;
          var publicPage =
            path === '/' ||
            path === '/login' ||
            path === '/signup' ||
            path === '/signup/complete' ||
            path === '/forgot-password' ||
            path === '/reset-password' ||
            path === '/verify-email';
          var theme = 'light';
          if (!publicPage) {
            theme = localStorage.getItem('ra_theme');
            if (theme !== 'dark' && theme !== 'light') theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
