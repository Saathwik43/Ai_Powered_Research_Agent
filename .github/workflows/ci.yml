name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete. Without this
# every push queues another full install of the backend dependency set.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the deploy target runs; 3.12 is what development uses.
        # Testing both catches version-only breakage in whichever direction.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests (excluding integration)
        working-directory: backend
        env:
          # Placeholders only. Every test either mocks its provider or sets the
          # environment it needs explicitly, so no real credential is required
          # — and no test may depend on one being present.
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-production"
          GOOGLE_CLIENT_ID: "ci-test-placeholder"
          MONGO_URI: "mongodb://localhost:27017"
          GEMINI_API_KEY: "ci-test-placeholder"
        run: pytest -v --strict-markers --durations=10

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
