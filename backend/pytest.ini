[pytest]
testpaths = tests
# `integration` is registered here as well as in conftest so --strict-markers
# cannot fail on it during collection, before conftest's hook has run.
markers =
    integration: makes real API calls; skipped unless --run-integration is passed
filterwarnings =
    ignore::DeprecationWarning:llama_parse.*
    ignore::DeprecationWarning:llama_cloud_services.*
    ignore::PendingDeprecationWarning
